

<!DOCTYPE html>
<html lang="fa-IR" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>todo app</title>
    <link rel="stylesheet" href="./public/css/styles.css" />
  </head>
  <body onload="getDataFromLocalStorage()">
    <div class="wrapper">
      <div class="title">
        <h1> لیست کارها </h1>
      </div>

      <div class="header-buttons">
        <div class="sort-card">
          <button class="sort-button">
            <span class="sort-type">همه</span>
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="size-4"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M15.75 19.5 8.25 12l7.5-7.5"
              />
            </svg>
          </button>
          <div class="sort-menu">
            <button value="all">همه</button>
            <button value="completed">تکمیل شده ها</button>
            <button value="uncompleted">تکمیل نشده ها</button>
          </div>
        </div>
        <button class="open-modal-button">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="size-4"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M12 4.5v15m7.5-7.5h-15"
            />
          </svg>
          ایجاد کار
        </button>
      </div>

      <section class="todos-container">
        <!-- Todos Added By Js -->
      </section>
    </div>

    <div class="modal-screen hidden">
      <div class="modal">
        <header>
          <button class="close-x-modal">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="size-6"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M6 18 18 6M6 6l12 12"
              />
            </svg>
          </button>
          <span> ایجاد کار جدید </span>
        </header>
        <main>
          <div class="input-card">
            <input
              type="text"
              class="input"
              placeholder="عنوان کار جدید را وارد نمائید ..."
            />
          </div>

          <!-- <div class="modal-checkbox"> -->
            <!-- <input type="checkbox" name="" id="has-date" /> -->
            <!-- <label for="has-date"> ایجاد تاریخ</label> -->
          <!-- </div> -->
        </main>
        <footer>
          <button class="cancel">انصراف</button>
          <button class="create">ایجاد</button>
        </footer>
      </div>
    </div>
     <article class="toast">
      <div class="icon">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="currentColor"
          class="size-5"
        >
          <path
            fill-rule="evenodd"
            d="M2.25 12c0-5.385 4.365-9.75 9.75-9.75s9.75 4.365 9.75 9.75-4.365 9.75-9.75 9.75S2.25 17.385 2.25 12Zm13.36-1.814a.75.75 0 1 0-1.22-.872l-3.236 4.53L9.53 12.22a.75.75 0 0 0-1.06 1.06l2.25 2.25a.75.75 0 0 0 1.14-.094l3.75-5.25Z"
            clip-rule="evenodd"
          />
        </svg>
      </div>
      <div class="toast-content">کار با موفقیت ثبت گردید</div>
    </article>

    <script src="./js/app.js"></script>
  </body>
</html>
